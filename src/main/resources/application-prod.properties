# ===================================================================
# Production Environment Configuration (application-prod.properties)
# ===================================================================

spring.application.name=hrms-portal

# Database configuration:
# Automatically handles DB_URL or DATABASE_URL provided by Render, Railway, Fly.io, Heroku, AWS RDS
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/hrms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:root123}}

# HikariCP Connection Pool optimization for production
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server & Dynamic Cloud Port
server.port=${PORT:8080}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=native

# Production Cache
spring.thymeleaf.cache=true

# File Upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
hrms.upload.dir=${UPLOAD_DIR:./uploads}

# Production Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=WARN
logging.level.com.hrms.portal=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
